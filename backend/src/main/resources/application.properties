spring.application.name=CampusBid-Backend
server.port=8080

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campusbid?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart file upload limits (5MB per file, 25MB total per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Upload directory
campusbid.upload.dir=uploads

# AI Auction Copilot Configuration (Environment-based with robust fallback)
campusbid.copilot.provider=${COPILOT_PROVIDER:fallback}
campusbid.copilot.api-key=${COPILOT_API_KEY:}
campusbid.copilot.model=${COPILOT_MODEL:gemini-1.5-flash}

# Spring Mail / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CampusBid Application Mail Properties
campusbid.mail.enabled=${CAMPUS_MAIL_ENABLED:false}
campusbid.mail.from=${CAMPUS_MAIL_FROM:noreply@campusbid.edu}
campusbid.app.base-url=${CAMPUS_APP_URL:http://localhost:5174}